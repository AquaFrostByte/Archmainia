name: Build
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            assets_dir: ""       
          - os: ubuntu-latest
            name: linux
            assets_dir: bin/     
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Show repo contents
        run: ls -la

      - name: Build jar
        run: |
          mkdir -p out input
          javac -d out *.java
          jar cfm ArchMania.jar Manifest.txt -C out .
          cp ArchMania.jar input/

      - name: Build app image
        run: |
          jpackage --type app-image --name ArchMania --input input \
            --main-jar ArchMania.jar --main-class Main \
            --add-modules java.base,java.desktop,java.logging \
            --dest dist

      - name: Copy assets
        run: |
          target="dist/ArchMania/${{ matrix.assets_dir }}"
          mkdir -p "$target"
          for item in img levels Skins Style config.txt; do
            if [ -e "$item" ]; then
              cp -r "$item" "$target"
            else
              echo "::warning::Missing in repo: $item"
            fi
          done

      - name: Package
        run: |
          cd dist
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a ../ArchMania-windows.zip ArchMania
          else
            tar czf ../ArchMania-linux.tar.gz ArchMania
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ArchMania-${{ matrix.name }}
          path: ArchMania-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*