name: Build
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            assets_dir: ""        # .exe sits in the app root
          - os: ubuntu-latest
            name: linux
            assets_dir: bin/      # launcher runs from bin/
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build jar and app image
        run: |
          mkdir -p out input
          javac -d out *.java
          jar cfm ArchMania.jar Manifest.txt -C out .
          cp ArchMania.jar input/
          jpackage --type app-image --name ArchMania --input input \
            --main-jar ArchMania.jar --main-class Main \
            --add-modules java.base,java.desktop,java.logging \
            --dest dist
          cp -r img levels Skins Style config.txt dist/ArchMania/${{ matrix.assets_dir }}

      - name: Package
        run: |
          cd dist
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a ../ArchMania-windows.zip ArchMania
          else
            tar czf ../ArchMania-linux.tar.gz ArchMania
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ArchMania-${{ matrix.name }}
          path: ArchMania-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*